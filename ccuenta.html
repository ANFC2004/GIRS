<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Simulador Genshin Impact</title>
  <link rel="stylesheet" href="styles/styles.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #12131C;
      color: #E2E8F0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1E202E;
      border: 1px solid #2A2D3D;
      border-radius: 12px;
      padding: 32px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #FFFFFF;
    }

    p {
      font-size: 0.9rem;
      color: #A0AEC0;
      margin-bottom: 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #CBD5E0;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #3A3D52;
      background-color: #161722;
      color: #FFFFFF;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #4FD1C5;
    }

    .btn-submit {
      width: 100%;
      padding: 12px 20px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
      background-color: #3182CE;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #2B6CB0;
    }

    .btn-submit:disabled {
      background-color: #2D3748;
      color: #718096;
      cursor: not-allowed;
    }

    .error-message {
      color: #FC8181;
      font-size: 0.85rem;
      margin-top: 14px;
      display: none;
    }

    .success-message {
      color: #68D391;
      font-size: 0.85rem;
      margin-top: 14px;
      display: none;
    }

    .login-link {
      margin-top: 24px;
      text-align: center;
      font-size: 0.9rem;
      color: #A0AEC0;
    }

    .login-link a {
      color: #4FD1C5;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    /* Overlay de Carga */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(18, 19, 28, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .loading-overlay.hidden {
      display: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #4FD1C5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Crear Cuenta</h1>
    <p>Registra tus datos para comenzar</p>

    <form id="registerForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="tuemail@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required minlength="6">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6">
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Crear cuenta</button>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <div class="login-link">
        ¿Ya tienes una cuenta? <a href="sesion.html">Iniciar Sesión</a>
      </div>
    </form>
  </div>

  <!-- Pantalla / Overlay de Carga -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p>Registrando cuenta...</p>
  </div>

  <!-- Librería cliente de Supabase desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Archivo de configuración e integración de base de datos -->
  <script src="script/db.js"></script>

  <script>
    const registerForm = document.getElementById('registerForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';

      if (password !== confirmPassword) {
        errorMessage.textContent = 'Las contraseñas no coinciden.';
        errorMessage.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      loadingOverlay.classList.remove('hidden');

      try {
        const { data, error } = await registerUser(email, password);

        if (error) {
          throw error;
        }

        loadingOverlay.classList.add('hidden');
        successMessage.textContent = '¡Cuenta creada con éxito! Redirigiendo a inicio de sesión...';
        successMessage.style.display = 'block';

        setTimeout(() => {
          window.location.href = 'sesion.html';
        }, 1500);

      } catch (err) {
        loadingOverlay.classList.add('hidden');
        errorMessage.textContent = err.message || 'Error al crear la cuenta. Inténtalo de nuevo.';
        errorMessage.style.display = 'block';
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
